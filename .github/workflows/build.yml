name: Build

on:
  push:
    branches: [main]
    tags: ['v*']          # push tag v1.0.0 → build + tạo/cập nhật Release
  pull_request:
    branches: [main]
  release:
    types: [published]    # tạo Release trên GitHub UI → build + đính kèm asset

permissions:
  contents: write         # cần để upload file vào Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: wails build -clean

      - name: Copy runtime dependencies
        run: |
          Copy-Item patches build\bin\ -Recurse
          Copy-Item asar-helper.mjs build\bin\
          Copy-Item node_modules build\bin\node_modules -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitkraken-enhancer-windows
          path: build/bin/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: wails build -clean

      - name: Copy runtime dependencies
        run: |
          cp -r patches build/bin/
          cp asar-helper.mjs build/bin/
          cp -r node_modules build/bin/node_modules/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitkraken-enhancer-macos
          path: build/bin/
          retention-days: 30

  # Chỉ chạy khi: publish Release trên UI, hoặc push tag v*
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: gitkraken-enhancer-windows
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: gitkraken-enhancer-macos
          path: dist/macos

      - name: Create archives
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          (cd dist/windows && zip -r "../gitkraken-enhancer-${TAG}-windows.zip" .)
          (cd dist/macos && tar czf "../gitkraken-enhancer-${TAG}-macos.tar.gz" .)
          ls -lh dist/*.zip dist/*.tar.gz

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: GitKraken Enhancer ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/gitkraken-enhancer-${{ steps.ver.outputs.tag }}-windows.zip
            dist/gitkraken-enhancer-${{ steps.ver.outputs.tag }}-macos.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
