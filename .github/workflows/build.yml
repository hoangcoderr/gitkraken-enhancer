name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: wails build -clean

      - name: Copy runtime dependencies
        run: |
          Copy-Item patches build\bin\ -Recurse
          Copy-Item asar-helper.mjs build\bin\
          Copy-Item node_modules build\bin\node_modules -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitkraken-enhancer-windows
          path: build/bin/
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: wails build -clean

      - name: Copy runtime dependencies
        run: |
          cp -r patches build/bin/
          cp asar-helper.mjs build/bin/
          cp -r node_modules build/bin/node_modules/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitkraken-enhancer-macos
          path: build/bin/
          retention-days: 30

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: gitkraken-enhancer-windows
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: gitkraken-enhancer-macos
          path: dist/macos

      - name: Create archives
        run: |
          cd dist/windows && zip -r ../gitkraken-enhancer-${{ github.event.release.tag_name }}-windows.zip .
          cd ../macos && tar czf ../gitkraken-enhancer-${{ github.event.release.tag_name }}-macos.tar.gz .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gitkraken-enhancer-${{ github.event.release.tag_name }}-windows.zip
            dist/gitkraken-enhancer-${{ github.event.release.tag_name }}-macos.tar.gz
